name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Evaluate every example offline (replays recorded model responses)
        run: ./gradlew run --args="evaluate-all --offline"

      - name: Committed evaluations are up to date
        run: git diff --exit-code -- inbound/

      - name: Harness health
        run: ./gradlew run --args="health"
